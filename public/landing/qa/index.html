<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>GCC Mentor responsive review</title><style>*{box-sizing:border-box}body{margin:0;background:#e4ebe7;font:12px system-ui}header{height:56px;display:flex;gap:8px;align-items:center;padding:8px}button,select{padding:7px;border:1px solid #0f4c43;border-radius:6px;color:#0f4c43;background:white}iframe{display:block;border:0;background:white;transform-origin:top left}section{overflow:hidden}#size{font-size:11px}</style><header><b>Responsive QA</b><select aria-label="Viewport width" id="width" onchange="setWidth(Number(this.value))"><option>360</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option><option>1920</option></select><button onclick="go('')">Hero</button><button onclick="go('#templates')">Orbit</button><button onclick="go('#readiness')">Readiness</button><button onclick="go('#journey')">Applications</button><button onclick="go('#services')">Services</button><button onclick="go('#interview')">Interview</button><button onclick="go('#markets')">Globe</button><button onclick="go('#about')">Founder</button><span id="size"></span></header><section id="stage"><iframe title="Landing page at measured viewport" src="/" id="landing" onload="this.contentDocument.documentElement.style.scrollbarWidth='none'"></iframe></section><script>function setWidth(w){const scale=Math.min(1,1296/w),h=w<768?844:900;const f=document.getElementById('landing');f.style.width=w+'px';f.style.height=h+'px';f.style.transform='scale('+scale+')';document.getElementById('stage').style.width=w*scale+'px';document.getElementById('stage').style.height=h*scale+'px';document.getElementById('size').textContent=w+'px render · '+Math.round(scale*100)+'% display'}function go(hash){document.getElementById('landing').src='/'+hash}setWidth(390)</script></html>
