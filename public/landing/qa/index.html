<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>GCC Mentor responsive review</title><style>*{box-sizing:border-box}body{margin:0;background:#e4ebe7;font:12px system-ui}header{height:56px;display:flex;gap:8px;align-items:center;padding:8px}button,select{padding:7px;border:1px solid #0f4c43;border-radius:6px;color:#0f4c43;background:white}iframe{display:block;border:0;background:white;transform-origin:top left}section{overflow:hidden}#size{font-size:11px}</style><header><b>Responsive QA</b><select aria-label="Viewport width" id="width" onchange="setWidth(Number(this.value))"><option>360</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option><option>1920</option></select><button onclick="go('')">Hero</button><button onclick="go('#templates')">Orbit</button><button onclick="go('#readiness')">Readiness</button><button onclick="go('#services')">Applications</button><button onclick="go('#services')">Services</button><button onclick="go('#interview')">Interview</button><button onclick="go('#markets')">Globe</button><button onclick="go('#about')">Founder</button><span id="size"></span></header><section id="stage"><iframe title="Landing page at measured viewport" src="/" id="landing" onload="observe(this)"></iframe></section><script>function observe(f){const w=f.contentWindow,d=f.contentDocument;d.documentElement.style.scrollbarWidth='none';f.dataset.lcp='';f.dataset.cls='0';f.dataset.longtask='0';f.dataset.fcp='';try{new w.PerformanceObserver(list=>{const items=list.getEntries();f.dataset.lcp=String(Math.round(items[items.length-1].startTime))}).observe({type:'largest-contentful-paint',buffered:true});let cls=0;new w.PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput)cls+=e.value;f.dataset.cls=String(cls)}).observe({type:'layout-shift',buffered:true});let count=0;new w.PerformanceObserver(list=>{count+=list.getEntries().length;f.dataset.longtask=String(count)}).observe({type:'longtask',buffered:true});new w.PerformanceObserver(list=>{for(const e of list.getEntries())if(e.name==='first-contentful-paint')f.dataset.fcp=String(Math.round(e.startTime))}).observe({type:'paint',buffered:true})}catch(e){f.dataset.metrics='unavailable'}}function setWidth(w){const scale=Math.min(1,1296/w),h=w<768?844:900;const f=document.getElementById('landing');f.style.width=w+'px';f.style.height=h+'px';f.style.transform='scale('+scale+')';document.getElementById('stage').style.width=w*scale+'px';document.getElementById('stage').style.height=h*scale+'px';document.getElementById('size').textContent=w+'px render · '+Math.round(scale*100)+'% display'}function go(hash){document.getElementById('landing').src='/'+hash}setWidth(390)</script></html>
